name: Fork Release

# Manual release pipeline for this fork:
# 1. Add repository secrets: KEYSTORE_BASE64 (base64 of your release.keystore),
#    RELEASE_STORE_PASSWORD, RELEASE_KEY_ALIAS, RELEASE_KEY_PASSWORD.
#    Generate the base64 locally with: base64 -w0 app/release.keystore
#    The keystore itself is gitignored (*.keystore) and never committed.
# 2. Trigger: Actions tab -> Fork Release -> Run workflow, enter the tag
#    matching app/build.gradle, e.g. v3.13.0-beta1.fork1.
# 3. Result: signed APK attached to a GitHub Release with generated notes.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag, must match versionName in app/build.gradle (e.g. v3.13.0-beta1.fork1)'
        required: true
      notes:
        description: 'Extra release notes (optional, appended after auto-generated notes)'
        required: false
        default: ''
      flavor:
        description: 'Build flavor'
        required: false
        default: 'free'
        type: choice
        options:
          - free
          - play

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build and publish fork release
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Cache Gradle
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*') }}-${{ hashFiles('**/gradle/wrapper/gradle-wrapper.properties') }}

      - name: Restore release keystore
        run: echo "$KEYSTORE_BASE64" | base64 -d > app/release.keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}

      - name: Assemble signed release APK
        run: |
          TASK=assembleFreeRelease
          if [ "${{ inputs.flavor }}" = "play" ]; then TASK=assemblePlayRelease; fi
          ./gradlew ":app:$TASK" \
            -PreleaseStoreFile=release.keystore \
            -PreleaseStorePassword="$RELEASE_STORE_PASSWORD" \
            -PreleaseKeyAlias="$RELEASE_KEY_ALIAS" \
            -PreleaseKeyPassword="$RELEASE_KEY_PASSWORD"
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}

      - name: Collect APK path
        id: apk
        run: |
          APK=$(ls app/build/outputs/apk/${{ inputs.flavor }}/release/*.apk | head -1)
          echo "path=$APK" >> "$GITHUB_OUTPUT"
          echo "Built: $APK"

      - name: Build release notes
        run: |
          gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" \
            -f tag_name='${{ inputs.tag }}' --jq .body > notes.md
          if [ -n "${{ inputs.notes }}" ]; then
            printf '\n\n%s\n' '${{ inputs.notes }}' >> notes.md
          fi
          cat notes.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish GitHub Release
        run: |
          gh release create '${{ inputs.tag }}' \
            --title '${{ inputs.tag }}' \
            --notes-file notes.md \
            '${{ steps.apk.outputs.path }}'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
